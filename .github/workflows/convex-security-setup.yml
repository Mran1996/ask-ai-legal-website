name: Convex Security Setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Apply security env vars and deploy Convex prod
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: ./scripts/apply-security-env.sh --prod

      - name: Upload webhook checklist (Cal.com + Resend values)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webhook-setup
          path: security-env.local.txt
          retention-days: 1

      - name: Print next steps
        if: success()
        run: |
          echo "Download artifact 'webhook-setup' from this workflow run."
          echo "Paste values into Cal.com and Resend dashboards (see docs/CONVEX_SECURITY_SETUP.md)."
